name: Pathle development checks
on:
  push:
    branches:
      - pathle-modular-dev
  workflow_dispatch:

permissions:
  contents: read

jobs:
  tests:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check out development branch
        uses: actions/checkout@v4
      - name: Install Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate release manifest, generated HTML and asset fingerprints
        run: node scripts/sync-release.cjs --check
      - name: Check JavaScript syntax
        run: |
          node --check scripts/sync-release.cjs
          for file in js/*.js; do
            node --check "$file"
          done
      - name: Run Pathle regression tests
        run: node --test tests/*.test.cjs
      - name: Dry-run the next release without modifying the repository
        run: |
          scratch="$(mktemp -d)"
          cp -a . "$scratch/site"
          cd "$scratch/site"
          node -e "const fs=require('node:fs');const m=JSON.parse(fs.readFileSync('version.json','utf8'));const p=m.version.split('.').map(Number);p[2]++;m.version=p.join('.');fs.writeFileSync('version.json',JSON.stringify(m,null,2)+'\n');"
          node scripts/sync-release.cjs --write
          node scripts/sync-release.cjs --check
          node --test tests/*.test.cjs
